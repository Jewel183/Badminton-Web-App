name: Deploy E-Commerce App to EC2

on:
  push:
    branches:
      - main
  
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/badminton-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/badminton-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  sast_scan:
    name: Code Security Scan (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/javascript"
          generateSarif: "1"

  sca_scan:
    name: Dependency Scan (Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy SCA Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build_push:
    name: Build and Push Docker Images
    needs: [sast_scan, sca_scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image_scan:
    name: Container Image Scan (Trivy)
    needs: [build_push]
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Production Deployment
    needs: [image_scan]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Copy docker-compose & monitoring config via internal SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "docker-compose.yml, prometheus/prometheus.yml"
          target: "~/Badminton-Web-App"

      - name: Deploy via Internal SSH Tunnel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Badminton-Web-App

            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/" .env
            else
              echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> .env
            fi

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verify Application Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Badminton-Web-App
            echo "Waiting for app to be ready"
            sleep 15

            echo "Checking health endpoint"
            curl -f http://localhost/api/health || exit 1

            echo "Checking all containers are running"
            NOT_RUNNING=$(docker compose ps --status exited --status dead -q)
            if [ -n "$NOT_RUNNING" ]; then
              echo "Some containers are not running:"
              docker compose ps
              exit 1
            fi

            echo "Checking prometheus targets are healthy"
            UNHEALTHY_TARGETS=$(docker run --rm --network container:prometheus curlimages/curl -s http://localhost:9090/api/v1/targets | grep -o '"health":"[a-z]*"' | grep -v '"up"' | wc -l)
            if [ "$UNHEALTHY_TARGETS" -gt 0 ]; then
              echo "Some Prometheus targets are unhealthy"
              exit 1
            fi

            echo "App is healthy"