services:
  backend:
    build: 
      context: ./src/backend
    container_name: badminton_backend
    ports:
      - "4000:4000" 
    environment:
      - NODE_ENV=production
    env_file:
      - ./src/backend/.env
    restart: unless-stopped

  frontend:
    build: 
      context: ./src/frontend
    container_name: badminton_frontend
    ports:
      - "80:80" 
    depends_on:
      - backend
    restart: unless-stopped