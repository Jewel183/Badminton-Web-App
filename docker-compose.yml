version: "3.9"

services:
  backend:
    image: ${DOCKER_USERNAME}/badminton-backend:${IMAGE_TAG:-latest}
    container_name: badminton_backend
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  frontend:
    image: ${DOCKER_USERNAME}/badminton-frontend:${IMAGE_TAG:-latest}
    container_name: badminton_frontend
    ports:
      - "80:80" 
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_network:
    driver: bridge