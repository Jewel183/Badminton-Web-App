services:
  backend:
    image: ${DOCKER_USERNAME}/badminton-backend:${IMAGE_TAG:-latest}
    container_name: badminton_backend
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  frontend:
    image: ${DOCKER_USERNAME}/badminton-frontend:${IMAGE_TAG:-latest}
    container_name: badminton_frontend
    ports:
      - "80:80" 
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node_exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - monitoring_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.3
    container_name: cadvisor
    restart: unless-stopped
    cgroup: host
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
      - '/dev/disk/:/dev/disk:ro'
    networks:
      - monitoring_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
      - node_exporter
    networks:
      - monitoring_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
  grafana:
    image: grafana/grafana:13.0.3
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://%(domain)s/grafana/
      - GF_SERVER_DOMAIN=${EC2_PUBLIC_IP}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_network
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  grafana_data:

networks:
  app_network:
    driver: bridge
  monitoring_network:
    driver: bridge